name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The product is Windows-only (tray, Credential Manager, time zone, process control).
    # Real-core tests run after the pinned executable has been verified below.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test portable updater safety and rollback
        shell: powershell
        run: ./packaging/portable/aec-update.ps1 -SelfTest
      - name: Test incremental HTTP download and offline Agent failure logs
        shell: powershell
        run: |
          cargo build -p aec-dev --bin aec-agent
          if ($LASTEXITCODE) { throw 'Agent build failed' }
          ./packaging/test-incremental-update.ps1
      - name: Test actual Windows taskbar identity
        shell: powershell
        run: |
          cargo build -p aec-control --locked
          if ($LASTEXITCODE) { throw 'Control center build failed' }
          1..3 | ForEach-Object {
            powershell -NoProfile -ExecutionPolicy Bypass -File packaging/test-shell-identity.ps1 -ControlExe ./target/debug/aec-control.exe
            if ($LASTEXITCODE) { throw "Native shell check failed on iteration $_" }
          }
      - name: Test packaged launch contract and updater dialog cancellation
        shell: powershell
        run: |
          cargo build -p aec-core --example packaged_identity_probe --locked
          if ($LASTEXITCODE) { throw 'Launch fixture build failed' }
          ./packaging/test-packaged-launch.ps1 -ProbeExe ./target/debug/examples/packaged_identity_probe.exe
          if ($LASTEXITCODE) { throw 'Launch contract failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/test-updater-shell.ps1 -ReportPath "$env:RUNNER_TEMP/aec-updater-shell.txt"
          if ($LASTEXITCODE) { throw 'Updater dialog identity/cancel failed' }
      - name: Diagnose native shell test failure
        if: failure()
        shell: powershell
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5); Id=1000,1026} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'powershell|aec-control' } |
            Select-Object TimeCreated, Id, Message | Format-List
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test desktop presentation in installed Edge
        shell: powershell
        run: |
          cargo build -p aec-core --example ui_preview --locked
          if ($LASTEXITCODE) { throw 'UI preview build failed' }
          $deps = Join-Path $env:RUNNER_TEMP 'aec-ui-dependencies'
          npm install --prefix $deps --no-audit --no-fund playwright@1.58.2
          if ($LASTEXITCODE) { throw 'Playwright install failed' }
          $env:AEC_NODE_MODULES = Join-Path $deps 'node_modules'
          node packaging/test-ui.cjs
          if ($LASTEXITCODE) { throw 'UI interaction tests failed' }
          cargo build -p aec-core --example cooperation_fixture --example browser_environment_fixture --locked
          if ($LASTEXITCODE) { throw 'Cooperation/browser fixtures build failed' }
          node packaging/test-cooperation.cjs
          if ($LASTEXITCODE) { throw 'Selected-site script preservation failed' }
          node packaging/test-browser-environment.cjs
          if ($LASTEXITCODE) { throw 'Installed Edge DNS/WebRTC environment test failed' }
      - name: Preserve isolated UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-ui-failure-${{ github.run_id }}
          path: .scratch/ui-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install NSIS for installer smoke test
        run: choco install nsis --yes --no-progress
      - name: Test interactive installer compilation
        shell: powershell
        run: ./packaging/test-installer.ps1
      - name: Download and verify pinned mihomo for packaging
        shell: powershell
        run: |
          $pin = Get-Content crates/aec-core/src/core/pin.rs -Raw
          $url = [regex]::Match($pin, 'ASSET_URL: &str =\s*"([^"]+)"').Groups[1].Value
          $assetHash = [regex]::Match($pin, 'ASSET_SHA256: &str = "([a-f0-9]{64})"').Groups[1].Value
          $exeName = [regex]::Match($pin, 'EXE_IN_ASSET: &str = "([^"]+)"').Groups[1].Value
          $exeHash = [regex]::Match($pin, 'EXE_SHA256: &str = "([a-f0-9]{64})"').Groups[1].Value
          if (-not $url -or -not $assetHash -or -not $exeName -or -not $exeHash) { throw 'mihomo pin is incomplete' }
          $archive = Join-Path $env:RUNNER_TEMP 'mihomo-pinned.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'mihomo-pinned'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $assetHash) { throw 'mihomo archive SHA256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $exe = Join-Path $expanded $exeName
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $exeHash) { throw 'mihomo executable SHA256 mismatch' }
          New-Item -ItemType Directory -Path runtime/bin -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination runtime/bin/aec-mihomo.exe
      - name: Test pinned core and loopback relay chain
        run: cargo test -- --include-ignored
      - name: Build portable package and installer
        shell: powershell
        run: ./packaging/build-portable.ps1
      - name: Test published updater compatibility with real release package
        shell: powershell
        run: |
          git fetch --no-tags origin d946400a93022c0dd53468c53398900c2ab25ca0 9011805fc234938628aebe37b757c2f979acfcf7 a7d17c5e6d72950ece2c6386f6a896189cfe9f83
          if ($LASTEXITCODE) { throw 'Cannot fetch pinned historical updater sources' }
          $baseline = Join-Path $env:RUNNER_TEMP 'aec-baseline-0.5.2.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/zxs4KHf/agent-egress-controller/releases/download/v0.5.2/AgentEgressController-0.5.2-portable.zip' -OutFile $baseline
          ./packaging/test-release-upgrade.ps1 -BaselineZip $baseline
          if ($LASTEXITCODE) { throw '0.5.2 upgrade compatibility failed' }
          $recent = Join-Path $env:RUNNER_TEMP 'aec-baseline-0.5.4.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/zxs4KHf/agent-egress-controller/releases/download/v0.5.4/AgentEgressController-0.5.4-portable.zip' -OutFile $recent
          ./packaging/test-release-upgrade.ps1 -BaselineZip $recent -BaselineVersion '0.5.4'
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: AgentEgressController-0.5.6-windows
          path: |
            dist/AgentEgressController-0.5.6-portable.zip
            dist/AgentEgressController-0.5.6-setup.exe
            dist/SHA256SUMS-0.5.6.txt
            dist/SHA256SETUP-0.5.6.txt
            dist/aec-update-0.5.6.ps1
            dist/SHA256UPDATER-0.5.6.txt
            dist/aec-incremental-0.5.6.json
            dist/SHA256INCREMENTAL-0.5.6.txt
            dist/aec-0.5.6-*.zip
          if-no-files-found: error
          retention-days: 14
