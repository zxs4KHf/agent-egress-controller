name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The product is Windows-only (tray, Credential Manager, time zone, process control).
    # Tests that need a real mihomo binary are #[ignore]d and run locally before a release.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test portable updater safety and rollback
        shell: powershell
        run: ./packaging/portable/aec-update.ps1 -SelfTest
      - name: Install NSIS for installer smoke test
        run: choco install nsis --yes --no-progress
      - name: Test interactive installer compilation
        shell: powershell
        run: ./packaging/test-installer.ps1
      - name: Download and verify pinned mihomo for packaging
        shell: powershell
        run: |
          $pin = Get-Content crates/aec-core/src/core/pin.rs -Raw
          $url = [regex]::Match($pin, 'ASSET_URL: &str =\s*"([^"]+)"').Groups[1].Value
          $assetHash = [regex]::Match($pin, 'ASSET_SHA256: &str = "([a-f0-9]{64})"').Groups[1].Value
          $exeName = [regex]::Match($pin, 'EXE_IN_ASSET: &str = "([^"]+)"').Groups[1].Value
          $exeHash = [regex]::Match($pin, 'EXE_SHA256: &str = "([a-f0-9]{64})"').Groups[1].Value
          if (-not $url -or -not $assetHash -or -not $exeName -or -not $exeHash) { throw 'mihomo pin is incomplete' }
          $archive = Join-Path $env:RUNNER_TEMP 'mihomo-pinned.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'mihomo-pinned'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $assetHash) { throw 'mihomo archive SHA256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $exe = Join-Path $expanded $exeName
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $exeHash) { throw 'mihomo executable SHA256 mismatch' }
          New-Item -ItemType Directory -Path runtime/bin -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination runtime/bin/aec-mihomo.exe
      - name: Build portable package and installer
        shell: powershell
        run: ./packaging/build-portable.ps1
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: AgentEgressController-0.5.0-windows
          path: |
            dist/AgentEgressController-0.5.0-portable.zip
            dist/AgentEgressController-0.5.0-setup.exe
            dist/SHA256SUMS-0.5.0.txt
            dist/SHA256SETUP-0.5.0.txt
          if-no-files-found: error
          retention-days: 14
