<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Egress Controller</title>
<style>
:root{color-scheme:light;--ink:#18201e;--muted:#65716d;--line:#dce3df;--surface:#fff;--wash:#f3f6f4;--green:#18784d;--amber:#a56a00;--red:#bb3939;--focus:#176b55;font:14px "Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash);height:100vh;display:grid;grid-template-rows:58px 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:650;white-space:nowrap}.state{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;background:#828c88;flex:none}.state-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.refresh{margin-left:auto;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink);padding:7px 10px;cursor:pointer}.refresh:hover{background:#f6f8f7}
main{min-height:0;display:grid;grid-template-columns:204px minmax(0,1fr)}nav{padding:16px 10px;background:#e9efec;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}.nav-label{padding:8px 10px 5px;color:var(--muted);font-size:11px;font-weight:600}.tab{width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:10px;color:#2c3733;font:inherit;cursor:pointer}.tab:hover{background:#dce6e1}.tab[aria-selected="true"]{background:#fff;color:var(--focus);font-weight:600;box-shadow:inset 3px 0 var(--focus)}.content{min-width:0;min-height:0;background:#fff}.page{width:100%;height:100%;border:0;display:none}.page.active{display:block}
@media(max-width:700px){body{grid-template-rows:auto 1fr}header{min-height:58px;padding:8px 12px;gap:10px;flex-wrap:wrap}.brand{font-size:14px}main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}nav{padding:6px;display:flex;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.nav-label{display:none}.tab{width:auto;white-space:nowrap;padding:9px}.tab[aria-selected="true"]{box-shadow:inset 0 -3px var(--focus)}.refresh{padding:6px 8px}}
</style>
</head>
<body>
<header><div class="brand">Agent Egress Controller</div><div class="state"><span id="dot" class="dot"></span><span id="state" class="state-text">正在读取托盘状态…</span></div><button id="refresh" class="refresh" type="button" title="刷新状态">刷新</button></header>
<main><nav aria-label="控制中心">
<div class="nav-label">管理</div>
<button class="tab" data-tab="setup" aria-selected="true">出口与系统设置</button>
<button class="tab" data-tab="dashboard" aria-selected="false">规则、站点与路径</button>
<button class="tab" data-tab="agent" aria-selected="false">Agent / MCP 接入</button>
<div class="nav-label">帮助</div>
<button class="tab" data-tab="help" aria-selected="false">代理冲突说明</button>
</nav><section class="content" aria-label="工作区">
<iframe class="page active" id="setup" title="出口与系统设置"></iframe>
<iframe class="page" id="dashboard" title="规则、站点与路径"></iframe>
<iframe class="page" id="agent" title="Agent 与 MCP 接入"></iframe>
<iframe class="page" id="help" title="代理冲突说明"></iframe>
</section></main>
<script>
const config=__CONFIG__;
const labels={daily:'日常模式',agent_ready:'Agent 模式已就绪',agent_unverified:'固定出口待验证',entering:'正在进入 Agent 模式',exiting:'正在退出并恢复',restore_incomplete:'恢复未完成'};
for(const [key,url] of Object.entries(config.pages)){document.getElementById(key).src=url}
function selectTab(key){if(!config.pages[key])return;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===key)));document.querySelectorAll('.page').forEach(f=>f.classList.toggle('active',f.id===key))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));
async function refresh(){try{const r=await fetch(config.stateUrl,{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();const mode=s.mode||'daily';document.getElementById('dot').style.background=s.blocked?'#bb3939':mode==='agent_ready'?'#18784d':mode==='agent_unverified'?'#a56a00':'#828c88';document.getElementById('state').textContent=(s.busy?'处理中 · ': '')+(labels[mode]||mode)+(s.path?' · '+s.path:'')+(s.summary?' · '+s.summary:'')}catch{document.getElementById('state').textContent='无法读取托盘状态；请确认托盘仍在运行'}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,3000);
const tab=new URLSearchParams(location.search).get('tab');if(tab)selectTab(tab);
</script>
</body></html>
