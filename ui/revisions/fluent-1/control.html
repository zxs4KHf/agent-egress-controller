<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Egress Controller</title><link rel="stylesheet" href="/ui/theme.css?t=__TOKEN__"><link rel="icon" href="/ui/icon.svg?t=__TOKEN__"><script src="/ui/app.js?t=__TOKEN__"></script><style>
body{height:100vh;display:grid;grid-template-rows:64px 1fr;overflow:hidden}header{display:flex;align-items:center;gap:12px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:650;font-size:16px}.brand small{display:block;font-weight:400;font-size:11px}.state{display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}.dot{height:8px;width:8px;border-radius:50%;background:#8994a0}.state-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px;font-size:12px;color:var(--muted)}main{max-width:none;margin:0;padding:0;display:grid;grid-template-columns:218px minmax(0,1fr);min-height:0}nav{background:#eef1f5;border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column;gap:5px}.nav-label{font-size:11px;font-weight:650;color:var(--muted);padding:0 12px 10px;letter-spacing:.8px}.tab{display:flex;justify-content:flex-start;width:100%;border:0;background:transparent;border-radius:8px;padding:11px 12px;gap:10px;font-weight:400;text-align:left}.tab:hover{background:#e3e8ee}.tab[aria-selected=true]{background:white;color:var(--accent);font-weight:600;box-shadow:0 1px 5px #223a4810,inset 3px 0 var(--accent)}.nav-footer{margin-top:auto;padding:14px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}.content{min-width:0;min-height:0}.page{width:100%;height:100%;border:0;display:none}.page.active{display:block}.refresh{min-height:32px;padding:6px 9px}.nav-gap{height:18px}.nav-footer .badge{margin-top:8px}
@media(max-width:700px){header{padding:10px 12px;gap:8px}.brand{font-size:13px}.brand small{display:none}.state-text{max-width:150px}main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}nav{padding:6px;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.tab{width:auto;white-space:nowrap;padding:8px}.nav-label,.nav-gap,.nav-footer{display:none}.tab[aria-selected=true]{box-shadow:inset 0 -2px var(--accent)}}
</style></head><body><header><img class="brand-icon" src="/ui/icon.svg?t=__TOKEN__" alt=""><div class="brand">Agent Egress<small>固定出口 · 本机控制中心</small></div><div class="state"><span id="dot" class="dot"></span><span id="state" class="state-text" role="status">正在读取托盘状态…</span></div><button id="refresh" class="refresh" data-icon="refresh" title="刷新实际状态" aria-label="刷新实际状态"></button></header><main><nav aria-label="控制中心"><div class="nav-label">工作区</div><button class="tab" data-tab="dashboard" data-icon="route" aria-selected="true">规则、站点与路径</button><button class="tab" data-tab="agent" data-icon="agent" aria-selected="false">Agent / MCP 接入</button><button class="tab" data-tab="setup" data-icon="settings" aria-selected="false">出口与系统设置</button><div class="nav-gap"></div><div class="nav-label">帮助</div><button class="tab" data-tab="help" data-icon="help" aria-selected="false">代理共存说明</button><div class="nav-footer">服务由托盘持续运行<br><span id="agentBadge" class="badge">本机控制：读取中</span></div></nav><section class="content" style="padding:0;margin:0;border:0;border-radius:0" aria-label="工作区"><iframe class="page" id="setup" title="出口与系统设置"></iframe><iframe class="page active" id="dashboard" title="规则、站点与路径"></iframe><iframe class="page" id="agent" title="Agent 与 MCP 接入"></iframe><iframe class="page" id="help" title="代理共存说明"></iframe></section></main><script>
const reload=document.createElement('button');reload.id='reloadUi';reload.className='refresh';reload.textContent='刷新界面';reload.title='加载最新界面，不重启网络服务';reload.onclick=()=>{if(confirm('重新加载界面会丢弃未保存的表单草稿，但不会停止网络服务。继续？'))location.reload()};document.querySelector('header').append(reload);
const config=__CONFIG__,labels={daily:'日常模式',agent_ready:'已就绪',agent_unverified:'待验证',entering:'正在启动',exiting:'正在恢复',restore_incomplete:'恢复未完成'};for(const [key,url] of Object.entries(config.pages))document.getElementById(key).src=url;
function selectTab(key){if(!config.pages[key])return;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===key)));document.querySelectorAll('.page').forEach(f=>f.classList.toggle('active',f.id===key));history.replaceState(null,'','/app?t='+new URLSearchParams(location.search).get('t')+'&tab='+key)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
window.addEventListener('message',event=>{if(event.origin!==location.origin||!Array.from(document.querySelectorAll('iframe')).some(f=>f.contentWindow===event.source))return;if(event.data?.type==='aec:navigate')selectTab(event.data.tab);if(event.data?.type==='aec:agent-state')agentState(event.data)});
function agentState(s){document.getElementById('agentBadge').textContent='本机控制：'+(!s.available?'不可用':s.enabled?'已开启':'已关闭');document.getElementById('agentBadge').className='badge'+(s.available&&s.enabled?' good':'')}
async function refresh(){try{const s=await AEC.json(config.stateUrl);document.getElementById('dot').style.background=s.blocked?'#b42318':s.mode==='agent_ready'?'#216347':s.mode==='agent_unverified'?'#986000':'#8994a0';document.getElementById('state').textContent=(s.busy?'处理中 · ':'')+(labels[s.mode]||s.mode)+(s.blocked?' · 受保护流量已阻断':'')}catch{document.getElementById('state').textContent='无法读取托盘状态'}try{agentState(await AEC.json(config.agentInfoUrl))}catch{document.getElementById('agentBadge').textContent='本机控制：状态未知'}}document.getElementById('refresh').onclick=refresh;selectTab(config.tab||'dashboard');refresh();setInterval(refresh,3000);
</script></body></html>
